name: Deploy to Fly.io

on:
  push:
    branches: [main]

jobs:
  pre-deploy-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f deploy/Dockerfile -t skitur-test .

      - name: Start container
        run: |
          docker run -d --name skitur-test \
            -p 8000:8000 \
            -e SKITUR_CONFIG=/app/deploy/config/production.py \
            skitur-test \
            gunicorn skitur.app:app --bind 0.0.0.0:8000 --workers 1 --timeout 120

      - name: Wait for server
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:8000/healthz | grep -q ok; then
              echo "Server is up"
              exit 0
            fi
            sleep 2
          done
          echo "Server failed to start"
          docker logs skitur-test
          exit 1

      - name: Run smoke tests against container
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium
          python scripts/smoke_test.py http://localhost:8000 --gpx tests/data/jotunheimen_short.gpx

      - name: Stop container
        if: always()
        run: docker rm -f skitur-test

  deploy:
    needs: pre-deploy-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy -c deploy/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Purge Cloudflare cache
        run: |
          curl -sf -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'

      - name: Smoke test production
        if: success()
        run: |
          pip install requests playwright
          python -m playwright install --with-deps chromium
          python scripts/smoke_test.py https://fjell.ski
