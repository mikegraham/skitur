name: Deploy to Fly.io

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy -c deploy/fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Ensure Cloudflare cache rule exists
        if: success()
        run: |
          curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/rulesets/phases/http_request_cache_settings/entrypoint" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"rules":[{"expression":"(http.request.uri.path eq \"/\")","description":"Cache HTML landing page","action":"set_cache_settings","action_parameters":{"cache":true}}]}'
        continue-on-error: true

      - name: Purge Cloudflare cache
        if: success()
        run: |
          curl -s -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
        continue-on-error: true

      - name: Smoke test
        if: success()
        run: |
          pip install requests pytest pytest-socket
          SMOKE_TEST_URL=https://fjell.ski python -m pytest tests/test_smoke.py -v --timeout=180 --noconftest -o "addopts="
