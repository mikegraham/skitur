<!DOCTYPE html>
<html>
<head>
    <title>{{ config.get('SITE_TITLE', 'Skitur') }}</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Preload CDN assets used by the report page so they're cached when needed -->
    <link rel="preload" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" as="style" crossorigin="anonymous" />
    <link rel="preload" href="https://cdn.plot.ly/plotly-3.3.1.min.js" as="script" crossorigin="anonymous" />
    <link rel="preload" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" as="script" crossorigin="anonymous" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { overflow-x: hidden; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
               background: linear-gradient(135deg, #e8eef5 0%, #f5f5f5 50%, #e8f0e8 100%);
               min-height: 100vh; color: #333; }

        #upload-section { max-width: 500px; margin: 80px auto; text-align: center;
                          padding: 44px 40px; background: white; border-radius: 12px;
                          box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        #upload-section h1 { font-size: 2.2em; margin-bottom: 6px; letter-spacing: -0.02em;
                              color: #1a1a2e; padding-bottom: 10px; }
        #upload-section h1::after { content: ""; display: block; width: 48px; height: 3px;
                                     background: linear-gradient(90deg, #4a7c59, #6a9fb5);
                                     border-radius: 2px; margin: 8px auto 0; }
        #upload-section p { color: #666; margin-bottom: 24px; font-size: 1.05em; }
        .badge-experimental { font-size: 0.32em; vertical-align: middle;
                              background: #f59e0b; color: white; padding: 2px 8px;
                              border-radius: 4px; letter-spacing: 0.05em;
                              font-weight: 600; position: relative; top: -0.15em; }
        .github-corner:hover .octo-arm { animation: octocat-wave 560ms ease-in-out; }
        @keyframes octocat-wave {
            0%, 100% { transform: rotate(0); }
            20%, 60% { transform: rotate(-25deg); }
            40%, 80% { transform: rotate(10deg); }
        }
        .github-corner svg { fill: #24292e; color: #fff; position: fixed; top: 0;
                              right: 0; z-index: 1000; border: 0; }
        .github-corner .octo-arm { transform-origin: 130px 106px; }
        .disclaimer { color: #666; font-size: 0.84em; line-height: 1.5; }
        #upload-section .disclaimer { margin-top: 28px; padding-top: 16px;
                                       border-top: 1px solid #eee; }
        #upload-form { display: flex; flex-direction: column; align-items: center; gap: 12px;
                       margin-bottom: 16px; }
        .file-label { display: inline-block; padding: 12px 28px; background: #f8f9fa;
                       border: 2px dashed #ccc; border-radius: 8px; cursor: pointer;
                       color: #555; font-size: 0.95em; transition: all 0.15s; }
        .file-label:hover { border-color: #4a7c59; color: #4a7c59; background: #f0f7f2; }
        #gpx-input { max-width: 100%; font-size: 0.95em; }
        #loading { margin-top: 20px; color: #666; display: none; }
        #loading::before { content: ""; display: inline-block; width: 14px; height: 14px;
                           border: 2px solid #ccc; border-top-color: #666;
                           border-radius: 50%; margin-right: 8px; vertical-align: middle;
                           animation: spin 0.8s linear infinite; }
        #loading::after { content: ""; animation: dots 1.5s steps(4, end) infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
        #upload-section.loading { animation: pulse-glow 2s ease-in-out infinite; }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
            50% { box-shadow: 0 4px 30px rgba(74,124,89,0.18), 0 4px 20px rgba(0,0,0,0.08); }
        }
        #error { margin-top: 20px; color: #dc2626; display: none;
                 background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px;
                 padding: 12px 16px; font-weight: 500; }

        .visually-hidden {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
        }

        @media (max-width: 700px) {
            #upload-section { margin: 24px 12px; padding: 22px 16px; }
        }
    </style>
</head>
<body>
        <a href="https://github.com/mikegraham/skitur" target="_blank" rel="noopener" class="github-corner" aria-label="View source on GitHub">
            <svg width="80" height="80" viewBox="0 0 250 250" aria-hidden="true">
                <path d="M0,0 L115,115 L130,115 L142,142 L250,250 L250,0 Z"></path>
                <path d="M128.3,109.0 C113.8,99.7 119.0,89.6 119.0,89.6 C122.0,82.7 120.5,78.6 120.5,78.6 C119.2,72.0 123.4,76.3 123.4,76.3 C127.3,80.9 125.5,87.3 125.5,87.3 C122.9,97.6 130.6,101.9 134.4,103.2" fill="currentColor" style="transform-origin: 130px 106px;" class="octo-arm"></path>
                <path d="M115.0,115.0 C114.9,115.1 118.7,116.5 119.8,115.4 L133.7,101.6 C136.9,99.2 139.9,98.4 142.2,98.6 C133.8,88.0 127.5,74.4 143.8,58.0 C148.5,53.4 154.0,51.2 159.7,51.0 C160.3,49.4 163.2,43.6 171.4,40.1 C171.4,40.1 176.1,42.5 178.8,56.2 C183.1,58.6 187.2,61.8 190.9,65.4 C194.5,69.0 197.7,73.2 200.1,77.6 C213.8,80.2 216.3,84.9 216.3,84.9 C212.7,93.1 206.9,96.0 205.4,96.6 C205.1,102.4 203.0,107.8 198.3,112.5 C181.9,128.9 168.3,122.5 157.7,114.1 C157.9,116.9 156.7,120.9 152.7,124.9 L141.0,136.5 C139.8,137.7 141.6,141.9 141.8,141.8 Z" fill="currentColor"></path>
            </svg>
        </a>
        <div id="upload-section">
            <h1>{{ config.get('SITE_TITLE', 'Skitur') }} <span class="badge-experimental">EXPERIMENTAL</span></h1>
            <p>Terrain and slope analysis for your XC ski tours</p>
            <form id="upload-form" method="POST" action="/analyze" enctype="multipart/form-data">
                <label class="file-label" for="gpx-input">Choose a GPX file</label>
                <input type="file" id="gpx-input" name="gpx_file" accept=".gpx" class="visually-hidden" />
            </form>
            <div id="loading" role="status" aria-live="polite" aria-atomic="true">Analyzing track (may take some time)...</div>
            <div id="error" role="alert" aria-live="assertive"></div>
            <div class="disclaimer"></div>
        </div>

<script>
const DISCLAIMER = '<strong>USE AT YOUR OWN RISK.</strong> Winter travel involves inherent risks of injury and death. Skitur provides automated terrain analysis provided "AS IS" and "WITH ALL FAULTS" without warranties of any kind, including accuracy or fitness for a particular purpose. This report is for informational purposes only and does not constitute professional advice. This report is not a substitute for official forecasts, education, or field judgment.';
document.querySelectorAll(".disclaimer").forEach(el => { el.innerHTML = DISCLAIMER; });

// Wake up server (triggers cold start if scaled to zero)
if (location.protocol !== "file:") fetch("/healthz").catch(() => {});

// Auto-submit on file selection, show spinner
document.getElementById("gpx-input").addEventListener("change", function() {
    if (this.files.length) {
        document.getElementById("loading").style.display = "block";
        document.getElementById("upload-section").classList.add("loading");
        document.getElementById("upload-form").submit();
    }
});

// Show error from redirect (e.g. /analyze returned an error)
const errorMsg = new URLSearchParams(window.location.search).get("error");
if (errorMsg) {
    document.getElementById("error").textContent = errorMsg;
    document.getElementById("error").style.display = "block";
    history.replaceState(null, "", "/");
}
</script>
</body>
</html>
